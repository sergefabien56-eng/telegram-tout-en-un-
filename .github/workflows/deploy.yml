name: Déploiement Render

# Déclenché quand la CI est verte (workflow_run) : rien n'est mis en production
# si le lint, les tests unitaires, le build ou les tests E2E échouent.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Un seul déploiement à la fois ; le plus récent annule l'autre.
concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # On ne déploie que si la CI a réussi.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://tout-en-un-business-manager.onrender.com
    steps:
      - name: Vérifier qu'un secret de déploiement existe
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$HOOK" ] && [ -z "$API_KEY" ]; then
            echo "::error::Aucun secret de déploiement configuré." >&2
            echo "Crée RENDER_DEPLOY_HOOK (recommandé) ou RENDER_API_KEY dans :" >&2
            echo "https://github.com/sergefabien56-eng/telegram-tout-en-un-/settings/secrets/actions" >&2
            exit 1
          fi

      - name: Déclencher le déploiement Render
        id: deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          URL: https://tout-en-un-business-manager.onrender.com
        run: |
          set -euo pipefail
          # Commit actuellement en ligne : on le retient pour distinguer
          # « le nouveau build est arrivé » de « l'ancienne instance répond
          # encore ».
          avant="$(curl -fsS --max-time 20 "$URL/api/health" 2>/dev/null \
            | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
          echo "commit_avant=${avant}" >> "$GITHUB_OUTPUT"
          echo "Commit en ligne avant le déploiement : ${avant:-inconnu}"
          if [ -n "$HOOK" ]; then
            echo "Déclenchement via le Deploy Hook (permission minimale)."
            curl -sSf -X POST "$HOOK"
          else
            echo "Déclenchement via l'API Render."
            curl -sSf -X POST \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -d '{"clearCache":"clear"}'
          fi

      - name: Attendre la mise en ligne et vérifier /api/health
        env:
          URL: https://tout-en-un-business-manager.onrender.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_AVANT: ${{ steps.deploy.outputs.commit_avant }}
        run: |
          set -euo pipefail
          # Pendant un déploiement, l'ancienne instance répond encore : un
          # simple « status ok » ne prouve donc **rien**. On exige que
          # l'instance en ligne serve le commit attendu — ou, si un push
          # plus récent a eu lieu entre-temps, qu'elle serve un build
          # **différent** de celui qui était en ligne avant le
          # déploiement. Aucune comparaison n'est faite via l'API GitHub :
          # elle dépendrait du quota de l'API et ferait échouer le
          # déploiement pour une raison étrangère au code.
          for attempt in $(seq 1 40); do
            body="$(curl -fsS --max-time 20 "$URL/api/health" || true)"
            if echo "$body" | grep -q '"status":"ok"'; then
              commit="$(echo "$body" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
              if [ -z "$commit" ] || [ "$commit" = "null" ]; then
                # Le commit n'est pas communiqué : on retombe sur l'ancien
                # contrôle, mais on le dit.
                echo "  [${attempt}] en ligne, commit non communiqué — ancien contrôle retenu"
                echo "✅ En ligne après ${attempt} tentative(s) : $body"
                exit 0
              fi
              if [ "$commit" = "$EXPECTED_SHA" ] || [ "$commit" = "${EXPECTED_SHA:0:7}" ]; then
                echo "✅ En ligne sur le commit ${commit} après ${attempt} tentative(s)"
                exit 0
              fi
              if [ -n "$COMMIT_AVANT" ] && [ "$commit" != "$COMMIT_AVANT" ]; then
                echo "✅ Un nouveau build est en ligne (${commit}), postérieur au commit ${COMMIT_AVANT}."
                exit 0
              fi
              echo "  [${attempt}] en ligne mais sur le commit ${commit} — nouveau build en cours"
            else
              echo "  [${attempt}] pas encore prêt…"
            fi
            sleep 15
          done
          echo "::error::Le service ne répond pas sur le commit attendu après 10 minutes." >&2
          exit 1
