name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=800
        run: npm test 2>&1 | tee unit-output.txt

      - name: Sortie des tests (diagnostic)
        if: ${{ always() && hashFiles('unit-output.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-output
          path: unit-output.txt
          if-no-files-found: warn

      - name: Build
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (pages publiques + accessibilité WCAG 2.1 AA)
        run: |
          set +e
          npx playwright test e2e/smoke.spec.ts e2e/accessibilite.spec.ts 2>&1 | tee e2e-output.txt
          echo "E2E_EXIT=${PIPESTATUS[0]}" >> e2e-output.txt
          exit ${PIPESTATUS[0]}

      - name: Sortie E2E (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.txt
          if-no-files-found: warn
