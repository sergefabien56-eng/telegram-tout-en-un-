# Blueprint Render — TOUT EN UN Business Manager
# Déploiement gratuit : https://render.com/deploy?repo=https://github.com/sergefabien56-eng/telegram-tout-en-un-
# Plan « free » : le service se met en veille après 15 min d'inactivité (réveil ~50 s).
services:
  - type: web
    name: tout-en-un-business-manager
    runtime: node
    plan: free
    # Les devDependencies (Tailwind, TypeScript) sont requises par `next build`.
    # NODE_ENV=production les sauterait : on force --include=dev.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      # NB : pas de NODE_ENV=production ici — il ferait sauter les devDependencies
      # pendant `npm install` et casserait `next build`.
      - key: NODE_VERSION
        value: "20"
      # --- Base de données (Neon, gratuit) ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # --- Sécurité ---
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # --- Jumia Vendor Center (optionnel tant que Phase 2 n'est pas lancee) ---
      - key: JUMIA_CLIENT_ID
        sync: false
      - key: JUMIA_REFRESH_TOKEN
        sync: false
      # Surtout en staging : https://vendor-api-staging.jumia.com
      - key: JUMIA_API_BASE
        sync: false
